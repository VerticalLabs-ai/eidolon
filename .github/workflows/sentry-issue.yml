name: Sentry alert to issue

on:
  repository_dispatch:
    types: [sentry-alert]
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  create-issue:
    name: Create a deduplicated Sentry issue
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Create or reuse GitHub issue
        env:
          SENTRY_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sentry-dispatch.mjs
