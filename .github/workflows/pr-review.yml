name: Automated pull request review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Quality and risk review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:run

      - name: Post review summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- eidolon-automated-review -->';
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const names = files.map((file) => file.filename);
            const sensitive = names.filter((name) =>
              /(^server\/src\/middleware\/|^server\/src\/auth\.ts$|^packages\/db\/|^\.github\/workflows\/|^\.env\.example$)/.test(name),
            );
            const conclusion = '${{ job.status }}' === 'success' ? 'passed' : 'needs attention';
            const body = [
              marker,
              '## Automated pull request review',
              '',
              `Quality gates: **${conclusion}**`,
              `Changed files reviewed: ${names.length}`,
              sensitive.length
                ? `Sensitive areas requiring maintainer attention: ${sensitive.map((name) => `\`${name}\``).join(', ')}`
                : 'No authentication, database, workflow, or environment files changed.',
              '',
              'This automation reports repository checks and changed sensitive areas. It does not replace human review.',
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.user.type === 'Bot' && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
