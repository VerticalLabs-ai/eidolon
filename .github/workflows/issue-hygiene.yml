name: Issue hygiene

on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark inactive issues and pull requests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 60
          days-before-close: -1
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: >
            This issue has had no activity for 60 days. It remains open for
            maintainer review and will not be closed automatically.
          stale-pr-message: >
            This pull request has had no activity for 60 days. It remains open
            for maintainer review and will not be closed automatically.
          # `security` was never a label in this repository, so the previous value
          # exempted nothing. Names come from .github/labels.json.
          exempt-issue-labels: pinned,type/security,area/security,priority/urgent
          exempt-pr-labels: pinned,type/security,area/security,priority/urgent

  labels:
    name: Check label taxonomy drift
    runs-on: ubuntu-latest
    permissions:
      issues: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      # The check needs only Node and the preinstalled GitHub CLI, so it skips
      # the pnpm install every other workflow needs.
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # Reports labels that are missing or have drifted from .github/labels.json.
      # Labels present only on GitHub are reported without failing, because a
      # maintainer may add one deliberately before the file catches up.
      - name: Check labels against .github/labels.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/sync-labels.mjs
