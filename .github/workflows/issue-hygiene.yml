name: Issue hygiene

on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark inactive issues and pull requests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 60
          days-before-close: -1
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: >
            This issue has had no activity for 60 days. It remains open for
            maintainer review and will not be closed automatically.
          stale-pr-message: >
            This pull request has had no activity for 60 days. It remains open
            for maintainer review and will not be closed automatically.
          exempt-issue-labels: pinned,security
          exempt-pr-labels: pinned,security
