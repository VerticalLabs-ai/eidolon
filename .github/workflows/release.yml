name: CalVer release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: calver-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/eidolon_test
    outputs:
      tag: ${{ steps.calver.outputs.tag }}
      skip: ${{ steps.calver.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter '!@eidolon/desktop'

      - name: Compute next CalVer tag
        id: calver
        run: bash scripts/calver-next-tag.sh

      - name: CalVer version for UI build
        run: echo "VITE_APP_VERSION=${{ steps.calver.outputs.tag }}" >> "$GITHUB_ENV"

      - run: pnpm run typecheck

      - name: Create test management database
        run: psql postgres://postgres@localhost:5432/postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE eidolon_test'

      - run: pnpm run test:run

      - run: pnpm run build

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create and push tag
        if: needs.verify.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ needs.verify.outputs.tag }}"
          git push origin "refs/tags/${{ needs.verify.outputs.tag }}"

      - name: Publish GitHub Release
        if: needs.verify.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sentry-source-maps:
    needs: [verify, release]
    if: needs.verify.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check Sentry configuration
        id: sentry-config
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_UI_PROJECT: ${{ vars.SENTRY_UI_PROJECT }}
        run: |
          if [[ -n "$SENTRY_AUTH_TOKEN" && -n "$SENTRY_ORG" && -n "$SENTRY_PROJECT" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            # The UI Sentry project defaults to the server project when a
            # dedicated SENTRY_UI_PROJECT variable is not configured.
            echo "ui-project=${SENTRY_UI_PROJECT:-$SENTRY_PROJECT}" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Sentry source map upload because SENTRY_AUTH_TOKEN, SENTRY_ORG, or SENTRY_PROJECT is not configured."
          fi

      - if: steps.sentry-config.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - if: steps.sentry-config.outputs.enabled == 'true'
        uses: pnpm/action-setup@v4

      - if: steps.sentry-config.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - if: steps.sentry-config.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile --filter '!@eidolon/desktop'

      - name: CalVer version for UI build
        if: steps.sentry-config.outputs.enabled == 'true'
        run: echo "VITE_APP_VERSION=${{ needs.verify.outputs.tag }}" >> "$GITHUB_ENV"

      - name: Build server and UI for source maps
        if: steps.sentry-config.outputs.enabled == 'true'
        run: pnpm run build

      - name: Create Sentry release and upload server source maps
        if: steps.sentry-config.outputs.enabled == 'true'
        uses: getsentry/action-release@v3
        with:
          environment: production
          version: ${{ needs.verify.outputs.tag }}
          sourcemaps: server/dist
          finalize: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}

      - name: Upload UI source maps to Sentry
        if: steps.sentry-config.outputs.enabled == 'true'
        uses: getsentry/action-release@v3
        with:
          environment: production
          version: ${{ needs.verify.outputs.tag }}
          sourcemaps: ui/dist
          finalize: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ steps.sentry-config.outputs.ui-project }}

  desktop-mac:
    needs: verify
    if: needs.verify.outputs.skip != 'true'
    runs-on: macos-latest
    outputs:
      artifact-created: ${{ steps.signing-inputs.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check macOS signing inputs
        id: signing-inputs
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if [[ -n "$MACOS_CERTIFICATE_P12" && -n "$MACOS_CERTIFICATE_PASSWORD" && -n "$APPLE_SIGNING_IDENTITY" && -n "$APPLE_TEAM_ID" && -n "$APPLE_ID" && -n "$APPLE_APP_SPECIFIC_PASSWORD" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping macOS DMG build because Developer ID signing secrets are not fully configured."
          fi

      - if: steps.signing-inputs.outputs.enabled == 'true'
        uses: pnpm/action-setup@v4

      - if: steps.signing-inputs.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Import Developer ID certificate
        if: steps.signing-inputs.outputs.enabled == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      - if: steps.signing-inputs.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build macOS DMG
        if: steps.signing-inputs.outputs.enabled == 'true'
        env:
          EIDOLON_DESKTOP_APP_URL: https://eidolon.verticallabs.ai
          EIDOLON_REQUIRE_MAC_SIGNING: '1'
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: pnpm desktop:make:mac

      - name: Upload DMG artifact
        if: steps.signing-inputs.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Eidolon-${{ needs.verify.outputs.tag }}-mac-arm64-dmg
          path: packages/desktop/out/make/*.dmg
          if-no-files-found: error

  attach-desktop:
    needs: [verify, release, desktop-mac]
    if: needs.verify.outputs.skip != 'true' && needs.desktop-mac.outputs.artifact-created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download DMG artifact
        uses: actions/download-artifact@v4
        with:
          name: Eidolon-${{ needs.verify.outputs.tag }}-mac-arm64-dmg
          path: desktop-artifacts

      - name: Attach DMG to GitHub Release
        run: gh release upload "${{ needs.verify.outputs.tag }}" desktop-artifacts/*.dmg --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
