name: DAST

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: HTTPS URL for a disposable or staging deployment. Production is rejected.
        required: true
        type: string

permissions:
  contents: read

jobs:
  zap-baseline:
    name: OWASP ZAP baseline scan
    runs-on: ubuntu-latest
    steps:
      - name: Validate target
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: |
          case "$TARGET_URL" in
            https://*) ;;
            *)
              echo "::error::DAST target must use HTTPS"
              exit 1
              ;;
          esac

          case "$TARGET_URL" in
            https://eidolon.verticallabs.ai|https://eidolon.verticallabs.ai/*)
              echo "::error::DAST refuses to scan the production hostname"
              exit 1
              ;;
          esac

      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ inputs.target_url }}
          fail_action: true
          allow_issue_writing: false
