name: Lint

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter '!@eidolon/desktop'

      - name: Run ESLint
        run: pnpm lint

      - name: Check formatting for changed files
        run: pnpm format:changed

      - name: Check duplicated code
        run: pnpm duplication

      - name: Check dead code and unused dependencies
        run: pnpm dead-code
