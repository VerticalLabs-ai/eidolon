name: Documentation

on:
  pull_request:
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'docs/**'
      - 'scripts/validate-docs.mjs'
      - '.github/workflows/docs.yml'
  push:
    branches: [main, staging]
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'docs/**'
      - 'scripts/validate-docs.mjs'
      - '.github/workflows/docs.yml'
  schedule:
    - cron: '9 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate documentation and agent instructions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check
