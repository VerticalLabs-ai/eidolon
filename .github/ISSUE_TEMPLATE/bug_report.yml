name: Bug report
description: Report a reproducible problem in Eidolon.
title: 'fix: '
labels:
  - type/bug
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the smallest sequence of commands or UI actions that reproduces the issue.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include OS, Node.js, pnpm, and Eidolon commit/version.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets, tokens, credentials, and personal data before sharing.
      render: shell
