name: Feature request
description: Propose a focused improvement to Eidolon.
title: 'feat: '
labels:
  - type/feature
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest useful solution and its boundaries.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable outcomes that prove the change works.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and data impact
      description: Note auth, migration, privacy, rollout, or operational concerns.
