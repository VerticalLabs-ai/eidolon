openapi: 3.0.3
info:
  title: Eidolon API
  version: 1.0.0
  description: |
    REST API for managing AI companies, agents, projects, tasks, and runtime
    operations. All company-scoped endpoints require an authenticated user
    with membership in the requested company.
servers:
  - url: /
    description: Current deployment
tags:
  - name: Health
  - name: Adapters
  - name: Companies
  - name: Agents
  - name: Projects
  - name: Tasks
  - name: Goals
  - name: Privacy
security:
  - clerkCookie: []
paths:
  /api/health:
    get:
      tags: [Health]
      summary: Read process liveness
      description: |
        Liveness only. Returns 200 whenever the process is running, including
        when a required dependency is unreachable. Use `/api/ready` for load
        balancer and deployment checks.
      security: []
      responses:
        '200':
          description: Process is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/ready:
    get:
      tags: [Health]
      summary: Read service readiness
      description: |
        Probes every required dependency and reports whether this instance can
        serve traffic. Probe failures are reported as `ok: false` without the
        underlying error, because the route is unauthenticated and driver errors
        carry connection details.
      security: []
      responses:
        '200':
          description: Every required dependency is reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: At least one required dependency is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /api/adapters:
    get:
      tags: [Adapters]
      summary: List available runtime adapters
      security: []
      responses:
        '200':
          description: Adapter registry
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Adapter'
  /api/companies:
    get:
      tags: [Companies]
      summary: List companies visible to the current user
      responses:
        '200':
          description: Companies
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Company'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Companies]
      summary: Create a company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyRequest'
      responses:
        '201':
          description: Company created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Company'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/companies/{companyId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Companies]
      summary: Get a company
      responses:
        '200':
          description: Company
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Company'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Companies]
      summary: Update a company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyRequest'
      responses:
        '200':
          description: Company updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Company'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/companies/{companyId}/agents:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Agents]
      summary: List company agents
      responses:
        '200':
          description: Agents
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Agent'
    post:
      tags: [Agents]
      summary: Create an agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
      responses:
        '201':
          description: Agent created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/ValidationError'
  /api/companies/{companyId}/tasks:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Tasks]
      summary: List company tasks
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [todo, in_progress, blocked, done, cancelled]
        - in: query
          name: projectId
          schema:
            type: string
            format: uuid
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Tasks
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
    post:
      tags: [Tasks]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationError'
  /api/companies/{companyId}/goals:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Goals]
      summary: List company goals
      responses:
        '200':
          description: Goals
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Goal'
  /api/companies/{companyId}/privacy/subjects/{userId}/export:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/SubjectUserId'
    get:
      tags: [Privacy]
      summary: Export the personal data held for a subject
      description: |
        Owner only (`privacy.manage`). Returns every row in this company that
        references the subject, table by table. Authentication material (MFA
        factors and session rows) is deliberately excluded.

        The subject must already be a member of the named company; any other
        subject returns 404 so an owner cannot probe membership elsewhere.
        Responses are sent with `Cache-Control: no-store`.
      responses:
        '200':
          description: Subject data export
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/SubjectExport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not an owner of this company
        '404':
          description: No such subject in this company
  /api/companies/{companyId}/privacy/subjects/{userId}/erase:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/SubjectUserId'
    post:
      tags: [Privacy]
      summary: Erase the personal data held for a subject
      description: |
        Owner only (`privacy.manage`). Irreversible. Deletes rows that exist only
        to describe the subject, nulls attribution on company work product, and
        pseudonymises audit and NOT NULL references.

        Check `remainingReferences` in the response: any non-zero value means the
        erasure was incomplete. Identity itself lives in Clerk and must be deleted
        there as well.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmSubject]
              properties:
                confirmSubject:
                  type: string
                  description: Must equal the `userId` path parameter.
                email:
                  type: string
                  format: email
                  description: |
                    Only needed for a pending invitation, which is keyed by email
                    and has no user id to match on.
      responses:
        '200':
          description: Erasure report
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ErasureReport'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not an owner of this company
        '404':
          description: No such subject in this company
        '409':
          description: An owner cannot erase their own subject data
components:
  securitySchemes:
    clerkCookie:
      type: apiKey
      in: cookie
      name: __session
  parameters:
    CompanyId:
      name: companyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SubjectUserId:
      name: userId
      in: path
      required: true
      description: External identity provider user id.
      schema:
        type: string
  responses:
    Unauthorized:
      description: Authentication is required
    NotFound:
      description: Resource was not found
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthResponse:
      type: object
      required: [status, uptime, timestamp, wsClients, memory]
      properties:
        status:
          type: string
          enum: [ok]
        uptime:
          type: number
        timestamp:
          type: string
          format: date-time
        wsClients:
          type: integer
        memory:
          type: object
          required: [rss, heapUsed]
          properties:
            rss:
              type: integer
            heapUsed:
              type: integer
    ReadinessResponse:
      type: object
      required: [status, timestamp, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        timestamp:
          type: string
          format: date-time
        checks:
          type: array
          items:
            type: object
            required: [name, ok, durationMs]
            properties:
              name:
                type: string
                description: Dependency identifier, for example `database`.
              ok:
                type: boolean
              durationMs:
                type: integer
                description: Probe duration in whole milliseconds.
    Adapter:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
    Company:
      type: object
      required: [id, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateCompanyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        budgetMonthlyCents:
          type: integer
          minimum: 0
    UpdateCompanyRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
    Agent:
      type: object
      required: [id, companyId, name, provider, model]
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        name:
          type: string
        provider:
          type: string
        model:
          type: string
        status:
          type: string
    CreateAgentRequest:
      type: object
      required: [name, provider, model]
      properties:
        name:
          type: string
        provider:
          type: string
        model:
          type: string
        role:
          type: string
        instructions:
          type: string
    Task:
      type: object
      required: [id, companyId, title, status, priority]
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [todo, in_progress, blocked, done, cancelled]
        priority:
          type: string
          enum: [low, medium, high, critical]
    CreateTaskRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string
        projectId:
          type: string
          format: uuid
        priority:
          type: string
          enum: [low, medium, high, critical]
    Goal:
      type: object
      required: [id, companyId, title, status]
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
    SubjectExport:
      type: object
      required: [subject, companyId, generatedAt, tables, totalRows]
      properties:
        subject:
          type: string
        companyId:
          type: string
          format: uuid
        generatedAt:
          type: string
          format: date-time
        totalRows:
          type: integer
        tables:
          type: array
          items:
            type: object
            required: [table, column, rows]
            properties:
              table:
                type: string
              column:
                type: string
                description: The column in that table holding the subject id.
              rows:
                type: array
                items:
                  type: object
                  additionalProperties: true
    ErasureReport:
      type: object
      required: [companyId, pseudonym, erasedAt, actions, rowsAffected, remainingReferences]
      properties:
        companyId:
          type: string
          format: uuid
        pseudonym:
          type: string
          description: Irreversible per-company identifier that replaced the subject id.
        erasedAt:
          type: string
          format: date-time
        rowsAffected:
          type: integer
        remainingReferences:
          type: integer
          description: |
            Rows still referencing the subject after erasure, re-counted from the
            database. Any value other than 0 means the erasure was incomplete.
        actions:
          type: array
          items:
            type: object
            required: [table, column, strategy, rowsAffected]
            properties:
              table:
                type: string
              column:
                type: string
              strategy:
                type: string
                enum: [delete, 'null', pseudonymise]
              rowsAffected:
                type: integer
    ErrorResponse:
      type: object
      required: [status, code, message]
      properties:
        status:
          type: integer
        code:
          type: string
        message:
          type: string
        details:
          description: Present for validation errors.
